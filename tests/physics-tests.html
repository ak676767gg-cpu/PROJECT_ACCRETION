<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physics and progression diagnostics | ACCRETION</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><style>body{background:#09121a;color:#dcebdc;font:14px system-ui,sans-serif;margin:40px auto;padding:0 25px;max-width:900px}h1{font-weight:400}p{color:#9db5a4;line-height:1.7}button{background:#b5e6ce;border:0;padding:14px 22px;cursor:pointer;border-radius:4px;color:#163024}table{margin-top:30px;width:100%;border-collapse:collapse}td{border-bottom:1px solid #294232;padding:12px 8px}.pass{color:#afe2ba}.fail{color:#ecaa92}small{color:#779b83}a{color:#b5e6ce}</style></head><body><p>ACCRETION / DEVELOPER DIAGNOSTICS</p><h1>Offline physics and progression checks</h1><p>These optional tests exercise the production simulation. They create isolated test universes and preserve your saved journey and records. The game itself needs no diagnostics or development tools.</p><button id="run">Run diagnostics</button><p id="summary"></p><table id="results"></table><p><a href="../index.html">Return to the game</a></p><script src="../js/core.js"></script><script src="../js/planetary.js"></script><script src="../js/life.js"></script><script src="../js/industry.js"></script><script src="../js/save.js"></script><script src="../js/audio.js"></script><script src="../js/upgrades.js"></script><script src="../js/player.js"></script><script src="../js/world.js"></script><script src="../js/ai.js"></script><script src="../js/physics.js"></script><script src="../js/effects.js"></script><script src="../js/rendering.js"></script><script src="../js/ui.js"></script><script src="../js/cosmic.js"></script><script src="../js/cosmic-rendering.js"></script><script src="../js/cosmic-ui.js"></script><script src="../js/expedition.js"></script><script src="../js/expedition-ui.js"></script><script src="../js/supernova.js"></script><script src="../js/supernova-rendering.js"></script><script src="../js/final-interstallar.js"></script><script src="../js/final-render.js"></script><script src="../js/final-ui.js"></script><script src="physics-tests.js"></script><script>document.getElementById('run').onclick=function(){this.disabled=true;document.getElementById('summary').textContent='Running isolated simulation checks…';setTimeout(()=>{const r=runAccretionTests(AC);document.getElementById('summary').textContent=r.filter(t=>t.pass).length+' / '+r.length+' checks passed.';const table=document.getElementById('results');table.textContent='';for(const t of r){const tr=document.createElement('tr');for(const text of [t.pass?'PASS':'FAIL',t.name+(t.error?' ; '+t.error:''),t.ms.toFixed(1)+' ms']){const td=document.createElement('td');td.textContent=text;tr.appendChild(td);}tr.className=t.pass?'pass':'fail';table.appendChild(tr);}this.disabled=false;},50);};</script></body></html>
